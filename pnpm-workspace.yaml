# Per-repo pnpm configuration only — this is deliberately NOT a monorepo.
#
# pnpm >= 10 moved settings out of .npmrc and into this file, and pnpm >= 11
# refuses every command when the file exists without a `packages:` key — down to
# `pnpm --version`. A single-package repo therefore declares the root as its one
# package rather than omitting the key.
packages:
  - '.'

# esbuild ships a postinstall that fetches its platform binary; pnpm blocks build
# scripts by default. `allowBuilds` is the pnpm >= 11 spelling (pnpm 10 called it
# `onlyBuiltDependencies`), and pnpm rewrites this block with a placeholder when a
# new dependency wants to run scripts — replace the placeholder with true/false
# rather than deleting it, or every command fails ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
