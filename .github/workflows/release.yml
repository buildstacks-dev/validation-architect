# Approval-gated single-package release. This workflow never runs on push and never
# creates a tag. npm authentication is OIDC trusted publishing; because this
# repository is private, npm provenance is deliberately not requested.
name: release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Exact 40-character commit SHA from the approval preview"
        required: true
      tag:
        description: "Existing exact tag (vX.Y.Z) at that commit"
        required: true
      digest:
        description: "Lowercase sha256 of the package tarball"
        required: true

permissions:
  contents: read

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.verify.outputs.version }}
      commit: ${{ steps.approved.outputs.commit }}
      tag: ${{ steps.approved.outputs.tag }}
      digest: ${{ steps.approved.outputs.digest }}
    steps:
      - name: Validate approval inputs before checkout or shell use
        id: approved
        env:
          APPROVED_COMMIT: ${{ inputs.commit }}
          APPROVED_TAG: ${{ inputs.tag }}
          APPROVED_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit must be exactly 40 lowercase hex characters"; exit 2; }
          [[ "$APPROVED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be exactly vX.Y.Z"; exit 2; }
          [[ "$APPROVED_DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "digest must be exactly 64 lowercase hex characters"; exit 2; }
          echo "commit=$APPROVED_COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag=$APPROVED_TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$APPROVED_DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.approved.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source and existing tag
        env:
          APPROVED_COMMIT: ${{ steps.approved.outputs.commit }}
          APPROVED_TAG: ${{ steps.approved.outputs.tag }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$APPROVED_COMMIT" ] || { echo "checkout did not resolve to approved commit"; exit 1; }
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$APPROVED_COMMIT" refs/remotes/origin/main || { echo "approved commit is not on main"; exit 1; }
          git fetch --force origin "refs/tags/$APPROVED_TAG:refs/tags/$APPROVED_TAG"
          [ "$(git rev-parse "$APPROVED_TAG^{commit}")" = "$APPROVED_COMMIT" ] || { echo "tag does not point to approved commit"; exit 1; }
          [ -z "$(git status --porcelain --untracked-files=all)" ] || { echo "source checkout is dirty"; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:package
      - name: Verify package identity and approved digest
        id: verify
        env:
          APPROVED_TAG: ${{ steps.approved.outputs.tag }}
          APPROVED_DIGEST: ${{ steps.approved.outputs.digest }}
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          [ "$APPROVED_TAG" = "v$VERSION" ] || { echo "approved tag does not name v$VERSION"; exit 1; }
          [ -z "$(git status --porcelain --untracked-files=all)" ] || { echo "dirty tree after verification"; exit 1; }
          mkdir -p "$CANDIDATE_DIR"
          pnpm pack --out "$CANDIDATE_DIR/package.tgz"
          DIGEST=$(sha256sum "$CANDIDATE_DIR/package.tgz" | cut -d' ' -f1)
          [ "$DIGEST" = "$APPROVED_DIGEST" ] || { echo "digest mismatch: built $DIGEST"; exit 1; }
          [ -z "$(git status --porcelain --untracked-files=all)" ] || { echo "dirty tree after packing"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-tarball
          path: ${{ runner.temp }}/candidate/package.tgz
          if-no-files-found: error

  publish:
    needs: verify-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.verify-candidate.outputs.version }}
      APPROVED_COMMIT: ${{ needs.verify-candidate.outputs.commit }}
      APPROVED_TAG: ${{ needs.verify-candidate.outputs.tag }}
      APPROVED_DIGEST: ${{ needs.verify-candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-candidate.outputs.commit }}
          persist-credentials: false
      - run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$APPROVED_COMMIT" ]
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Pin trusted-publishing npm CLI
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0
          [ "$(npm --version)" = "11.19.0" ]
      - name: Export candidate directory for publication steps
        run: echo "CANDIDATE_DIR=$RUNNER_TEMP/candidate" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-tarball
          path: ${{ runner.temp }}/candidate
      - name: Re-verify downloaded artifact digests
        run: |
          set -euo pipefail
          [ "$(sha256sum "$CANDIDATE_DIR/package.tgz" | cut -d' ' -f1)" = "$APPROVED_DIGEST" ]
      - name: Inspect registry and plan publication or no-op
        id: registry-plan
        run: node scripts/release-registry.mjs plan "$RELEASE_VERSION" "$CANDIDATE_DIR/package.tgz"
      - name: Publish package when absent
        if: steps.registry-plan.outputs.publish == 'true'
        id: publish-package
        continue-on-error: true
        run: npm publish "$CANDIDATE_DIR/package.tgz" --access public --ignore-scripts
      - name: Always reconcile final registry integrity
        if: always()
        run: node scripts/release-registry.mjs verify "$RELEASE_VERSION" "$CANDIDATE_DIR/package.tgz"
