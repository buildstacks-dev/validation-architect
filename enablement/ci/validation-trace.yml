name: validation-trace

on:
  pull_request:
  push:
    branches: [main]

jobs:
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Check design-to-implementation closure
        run: pnpm exec validation-trace . --manifest validation-design/case-catalog.yaml
