# Historically named validation-trace.yml: the gate now runs
# `validation-architect check` (the `validation-trace` bin remains a
# deprecated alias for the same closure check through 0.x and is removed at
# 1.0). The filename is kept so existing product-repo references survive one
# more enablement refresh; rename it freely when adopting.
name: validation-architect-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Check design-to-implementation closure
        run: pnpm exec validation-architect check .
