# roles.yaml — v0 DRAFT (2026-07-03), for discussion
#
# One entry per employee. `runtime` selects the adapter (claude | codex | pi),
# `model` is a config swap, `effort` is generic and mapped per-adapter
# (Anthropic: low..max; OpenAI: reasoning effort; pi: thinking level).
# `delegation` is the intra-turn fan-out policy — what the harness may spawn
# INSIDE a turn. Cross-provider mixing never happens intra-turn; it is an
# org-level flow between roles (see docs/PURPOSE.md).
#
# Model IDs: verified against live catalogs on 2026-07-05 and refreshed on
# 2026-07-15 — see research/2026-07-15_model-assignment-refresh.md.

defaults:
  max_turn_budget_usd: 5        # hard stop per turn; overrun = incident note, not silent spend
  telemetry: per-turn           # tokens + cost recorded per role turn, incl. subagent spend
  session_retention_days: 30

roles:
  planner:
    runtime: claude
    model: claude-opus-4-8      # frontier: ticket quality determines everything downstream
    effort: xhigh
    delegation:
      allow: [research-fanout]  # parallel readers over feedback/repo/issues; no code subagents
    triggers:
      - schedule: "daily 07:00"     # synthesize support digest, groom backlog
      - schedule: "weekly mon"      # deep planning pass
      - event: support-feedback     # groom feed: a user-feedback drop grooms the backlog with that signal (docs/scheduler/event-schemas.md)
      - event: adoption-signal      # groom feed: an adoption movement grooms the backlog with that signal (docs/scheduler/event-schemas.md)
    outputs: [tickets, priorities, roadmap-notes]

  builder:
    runtime: codex              # DELIBERATELY a different provider than reviewer —
    model: gpt-5.6-sol          # current exact flagship snapshot; no moving alias
    effort: high                # build quality over token cost — the Reviewer gate
    max_turn_budget_usd: 50     # a frontier builder implementing a real ticket in
                                # one turn (contract-sized context + tool loop)
                                # routinely exceeds the $5 default; caps bound
                                # spend, they don't downgrade the model.
                                # Raised from $15 on 2026-07-20: a real builder
                                # turn was killed mid-work 65 tool calls in,
                                # abandoning the slice. A cap should bound a
                                # runaway, not guillotine honest progress.
    delegation:                 # stays as the second line of defense
      allow: [explore, test-fanout]
    triggers:
      - event: ticket-ready     # wakes when Planner labels a ticket ready
    outputs: [pr]

  reviewer:
    runtime: claude             # DELIBERATELY a different provider than builder —
    model: claude-opus-4-8      # uncorrelated blind spots; the single most important
    effort: xhigh               # pairing decision in this file
    max_turn_budget_usd: 50     # xhigh adversarial review of a real diff needs
                                # more than the $5 default; bounded, not
                                # downgraded. Raised from $15 on 2026-07-20
                                # alongside the builder cap.
    delegation:
      allow: [adversarial-verify]   # N independent verifiers per finding before reporting
    triggers:
      - event: pr-opened
    outputs: [review, merge-verdict]

  sre:
    runtime: codex
    model: gpt-5.6-sol          # ratified 2026-07-15; lower tiers require separate measured evidence
    effort: medium
    delegation:
      allow: [explore]
    triggers:
      - schedule: "hourly"          # health sweep
      - event: ci-failed
      - event: health-alert         # documented company-lifecycle kind for service-health drops (docs/scheduler/event-schemas.md); replaces the generic alert-webhook placeholder now that inbox files parse to typed kinds
    outputs: [fixes, infra-prs, incident-notes]
    # deploys / DNS / secrets remain human-gated regardless of model (critical ops)

  support:
    runtime: claude
    model: claude-sonnet-5      # high volume, low stakes per message → cheap tier
    effort: medium              # that still writes well; Haiku scouts for triage
    adaptive_assignments:
      - id: pi-openai-gpt-5.6-sol-medium-qualified-20260718
        harness: pi
        model: openai-codex/gpt-5.6-sol
        efforts: [medium]
        provider_family: openai
        capability_ref: pi/v1
        qualification_ref: campaign:candidate-qualification-v1-20260718-eb658f6309c9
        conservative_estimate:
          max_turn_cost_usd: 5
          source: https://developers.openai.com/api/docs/pricing
    delegation:
      allow: [triage-fanout]
    triggers:
      - schedule: "every 4h"
      - event: support-feedback     # a user-feedback drop wakes the digest immediately, not just on the 4h cadence (docs/scheduler/event-schemas.md)
    outputs: [feedback-digest, reply-drafts]
    # v1: replies are DRAFTS — posting publicly = external publishing = critical op,
    # so human-approved until calibration earns autonomy. Digests flow to Planner
    # automatically (internal, ungated).

  marketing:
    runtime: claude
    model: claude-sonnet-5      # strong prose at volume; swap to Opus for
    effort: high                # positioning-level work
    adaptive_assignments:
      - id: pi-openai-gpt-5.6-sol-medium-qualified-20260718
        harness: pi
        model: openai-codex/gpt-5.6-sol
        efforts: [medium]
        provider_family: openai
        capability_ref: pi/v1
        qualification_ref: campaign:candidate-qualification-v1-20260718-eb658f6309c9
        conservative_estimate:
          max_turn_cost_usd: 5
          source: https://developers.openai.com/api/docs/pricing
    delegation:
      allow: [research-fanout]  # competitive/landscape reads, adoption-signal sweeps
    triggers:
      - event: release-shipped  # changelog + launch notes for every ship
      - schedule: "weekly thu"  # content + positioning pass
      - event: adoption-signal  # an adoption movement wakes the ci-sweep/adoption-digest pass (docs/scheduler/event-schemas.md)
      - event: launch-calendar  # a planned launch/announcement date wakes the release pass to draft notes (docs/scheduler/event-schemas.md)
    outputs: [changelog, launch-post-drafts, positioning-notes, adoption-digest]
    # same rule as support: anything public is a DRAFT until human-approved
    # (external publishing = critical op); adoption-digest flows to Planner ungated

  distiller:
    runtime: claude
    model: claude-sonnet-5      # scheduled synthesis after deterministic zero-token prechecks
    effort: medium
    delegation:
      allow: []                 # one bounded evidence batch; no fan-out or direct publication
    triggers:
      - schedule: "daily 06:00"
    outputs: [learning-candidates]

  learning-reviewer:
    runtime: codex              # DELIBERATELY cross-provider from distiller —
    model: gpt-5.6-sol          # independent injection/scope/destination screening
    effort: high
    delegation:
      allow: []
    triggers:
      - schedule: "weekly mon 07:00"
    outputs: [learning-review-verdicts, compaction-report]
