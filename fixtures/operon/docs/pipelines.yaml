# pipelines.yaml — the org's build protocol as ordered passes (docs/loop/design.md §4).
#
# Human-ratified surface: agents propose changes via PR; only the human
# merges (the safety gate's protocol-self-edit rule covers this file and
# prompts/**). Loaded and validated by src/loop/pipelines.ts; every
# template path resolves under prompts/.
#
# Two tiering axes, deliberately orthogonal (docs/loop/design.md §4):
#   - ticket tier (Planner label op:tier-quick|standard|deep) selects PASSES
#   - risk tier (.operon/policy.yaml changed-file globs) selects GATES
# Tiering makes the loop cheaper, never less safe: a quick ticket touching
# auth/** still gets high-tier gates.
#
# Planner and standing-role pipelines are the M8 bridge from roles.yaml
# triggers to executable protocols. The build loop remains the path for
# Builder ticket work; these pipelines create and curate the inputs it consumes.

build:
  passes:
    - id: contract # implementation contract before code; criterion→test mapping feeds the completeness gate (§5)
      role: builder
      template: build/contract.md
    - id: implement
      role: builder
      template: build/implement.md

review:
  passes:
    - id: verify # always-on functionality review; security lens baked into the template (§4)
      role: reviewer
      template: review/verify.md
    - id: security-deep # second, deeper security depth — on trigger (§4 review dimensions)
      role: reviewer
      template: review/security.md
      only_on: { risk: [high], dimension_globs: security }
    - id: perf-scale # performance & scale lens — on trigger only
      role: reviewer
      template: review/perf.md
      only_on: { labels: [op:perf-sensitive], dimension_globs: perf }

fix: # bounce target: the brief carries reviewer findings or verbatim gate output
  passes:
    - id: fix
      role: builder
      template: build/fix.md

ship:
  mechanical: true # merge is orchestrator work; agent judgment only on trigger (§5)
  passes:
    - id: ship-check # judgment layer above green gates: high risk OR deep tier (§4 tiering)
      role: reviewer
      template: ship/check.md
      only_on: { risk: [high], tier: [deep] }

# One-pass bootstrap planning (proportionality-review Stage 4): a new app's
# first milestone is a single planning turn producing a schema-validated
# 1-3-ticket plan the orchestrator publishes. The five-pass plan pipeline
# below remains the mature-app path.
plan-bootstrap:
  passes:
    - id: bootstrap-plan
      role: planner
      template: plan/bootstrap.md
      effort: high

plan:
  passes:
    - id: visionary
      role: planner
      template: plan/visionary.md
      effort: high
    - id: pm-a
      role: planner
      template: plan/pm.md
      parallel_group: competing-pms
    - id: pm-b
      role: planner
      template: plan/pm-b.md
      parallel_group: competing-pms
    - id: arbitrator
      role: planner
      template: plan/arbitrator.md
    - id: decomposer
      role: planner
      template: plan/decomposer.md

groom:
  passes:
    - id: groom
      role: planner
      template: groom/groom.md

triage:
  passes:
    - id: triage
      role: planner
      template: triage/triage.md

sre-incident:
  passes:
    - id: incident
      role: sre
      template: sre/incident.md

sre-health:
  passes:
    - id: health
      role: sre
      template: sre/health.md

support-digest:
  passes:
    - id: digest
      role: support
      template: support/digest.md

marketing-release:
  passes:
    - id: release
      role: marketing
      template: marketing/release.md

ci-sweep:
  passes:
    - id: sweep
      role: marketing
      template: marketing/ci-sweep.md

learning-distill:
  passes:
    - id: distill
      role: distiller
      template: learning/distill.md

learning-review:
  passes:
    - id: review
      role: learning-reviewer
      template: learning/review.md
